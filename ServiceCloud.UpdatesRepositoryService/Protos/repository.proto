syntax = "proto3";

// Пространство имён, в которое будут помещены сгенерированные классы
option csharp_namespace = "ServiceCloud.UpdatesRepositoryService.Grpc";

// ****************************************************************
// Определение сервиса репозитория обновлений информационных баз 1С
// ****************************************************************
service UpdatesRepository
{
   // Получить количество доступных обновлений конфигураций информационных баз 1С
   rpc GetUpdatesCount (UpdatesCountRequest) returns (UpdatesCountReply);
   // Получить коллекцию доступных обновлений конфигураций информационных баз 1С
   rpc GetUpdatesList(UpdatesListRequest) returns (stream  InfoBaseUpdate);
   // Проверить наличие обновления для заданной конфигурации информационной базы
   rpc ContainsUpdate(InfoBaseConfig) returns (ContainsUpdateReply);
   // Получить данные об обновлении информационной базы до указанной конфигурации с учётом необходимости перехода на новую редакцию
   rpc GetUpdate(InfoBaseUpdateRequest) returns (InfoBaseUpdate);
   // Получить список обновлений, которые предположительно можно установить на указанную конфигурацию базы
   rpc GetPotentialUpdatesList(InfoBaseConfig) returns (stream InfoBaseUpdate);
   // Получить информацию о расположении данных обновления конфигурации информационной базы 1С
   rpc GetLocation(InfoBaseUpdateLocationRequest) returns (InfoBaseUpdateLocationReply);
}

// ******************************************
// Запрос количество доступных обновлений баз
// ******************************************
message UpdatesCountRequest
{
}

// ***************************************************
// Ответ на запрос количества доступных обновлений баз
// ***************************************************
message UpdatesCountReply
{
	// Общее количество обновлений в репозитории
    int32 count = 1;
}

// ********************************************************
// Запрос списка доступных обновлений информационных баз 1С
// ********************************************************
message UpdatesListRequest
{
}

// *****************************************************************
// Ответ на запрос проверки присутствия в репозитории обновления для
// заданной конфигурации ИБ 1С
// *****************************************************************
message ContainsUpdateReply
{
	// Признак наличия обновления для заданной конфигурации в репозитории
	bool contains = 1;
}

// ***************************************************************
// Запрос информации об обновлении для заданной конфигурации ИБ 1С
// ***************************************************************
message InfoBaseUpdateRequest
{
	// TRUE - требуется обновление редакции, FALSE - обновление версии
	bool transitive = 1;
	// Конфигурация информационной базы, для которой запрашивается обновление
	InfoBaseConfig config = 2;
}

// *********************************************************
// Запрос размещения заданного обновления конфигурации ИБ 1С
// *********************************************************
message InfoBaseUpdateLocationRequest
{
	// Идентификатор обновления в репозитории
	string update_id = 1;
}

// Ответ на запрос размещения заданного обновления в репозитории
message InfoBaseUpdateLocationReply
{
	// Размещение бинарных данных обновления в репозитории
	string location = 1;
}

// ********************************************
// Данные о конфигурации информационной базы 1С
// ********************************************
message InfoBaseConfig
{
	// ************************************************************
	// Возможные типы (редакции) конфигураций информационных баз 1С
	// ------------------------------------------------------------
	// На данный момент редакции имеются только у конфигураций,
	// поставляемых фирмой 1С. Редакция зависит от типа лицензии,
	// приобретенной пользователем и указывается в наименовании конфигурации.
	// ************************************************************
	enum InfoBaseEdition
	{
		// Редакция информационной базы не определена
		UNKNOWN = 0;
		// Базовая редакция
		BASE	= 1;
		// Редакция ПРОФ
		PROF	= 2;
		// Редакция КОРП
		CORP	= 3;
	}

	// Наименование конфигурации
	string name = 1;
	// Наименование издателя конфигурации
	string publisher = 2;
	// Версия конфигурации
	string version = 3;
	// Редакция конфигурации
	InfoBaseEdition edition = 4;
}

// ********************************************************
// Данные об обновлении конфигурации информационной базы 1С
// ********************************************************
message InfoBaseUpdate
{
	// Идентификатор обновления в репозитории
	string id = 1;
	// Признак, определяющий является ли обновление "переходом" между редакциями конфигурации
	// Переходы между редакциями актуальны, только для конфигураций поставляемых фирмой 1С
	bool is_transitive = 2;
	// Конфигурация базы 1С, которая содержится в обновлении
	// Конфигурация, которая будет у базы 1С после применения к ней данного обновления
	InfoBaseConfig destination_config = 3;
	// Список конфигураций информационных баз 1С, для которых предназначено это обновление
	repeated InfoBaseConfig source_configs = 20;
}
